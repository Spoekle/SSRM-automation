name: Build and Release
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
jobs:
  # Gate: reject PRs to main that don't come from dev
  validate-pr:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        run: |
          if [[ "${{ github.head_ref }}" != "dev" ]]; then
            echo "::error::PRs to main are only allowed from the dev branch. Got: ${{ github.head_ref }}"
            exit 1
          fi
          echo "PR from dev to main — allowed."
  build:
    # Skip if the PR validation gate failed (only applies to PRs targeting main)
    needs: [validate-pr]
    if: |
      always() &&
      (needs.validate-pr.result == 'success' || needs.validate-pr.result == 'skipped')
    strategy:
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract and sync version
        id: version
        shell: bash
        run: |
          # Read version from package.json (single source of truth)
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"
          # Convert to MSI-compatible format for Tauri/Cargo
          # "3.0.0-beta.8" → "3.0.0-8", "3.0.0" → "3.0.0"
          TAURI_VERSION=$(echo "$VERSION" | sed -E 's/-[a-zA-Z]+\./\-/')
          echo "tauri_version=$TAURI_VERSION" >> $GITHUB_OUTPUT
          echo "Tauri/Cargo version: $TAURI_VERSION"
          # Update tauri.conf.json
          jq --arg v "$TAURI_VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          echo "Updated tauri.conf.json"
          # Update Cargo.toml
          sed -i.bak "s/^version = .*/version = \"$TAURI_VERSION\"/" src-tauri/Cargo.toml && rm -f src-tauri/Cargo.toml.bak
          echo "Updated Cargo.toml"
      - name: Determine release type
        id: release_type
        shell: bash
        run: |
          REF="${{ github.ref }}"
          EVENT="${{ github.event_name }}"
          if [[ "$EVENT" == "pull_request" ]]; then
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "PR build — no release will be created"
          elif [[ "$REF" == "refs/heads/main" ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "Stable release (main branch push)"
          elif [[ "$REF" == "refs/heads/dev" ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "Pre-release (dev branch push)"
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install dependencies
        run: npm ci
      - name: Generate GitHub Token
        if: steps.release_type.outputs.is_release == 'true'
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_PRIVATE_KEY }}
      # Build + Release (push to main or dev)
      - name: Build and Release
        if: steps.release_type.outputs.is_release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: 'SSRM Automation v${{ steps.version.outputs.version }}'
          releaseDraft: false
          prerelease: ${{ steps.release_type.outputs.prerelease }}
          generateReleaseNotes: true
          args: ${{ matrix.args }}
      # Build only (PRs — validation, no release)
      - name: Build (PR validation)
        if: steps.release_type.outputs.is_release == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
  # Single status check that aggregates all matrix build results
  # Use "build-complete" as the required status check in branch protection
  build-complete:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::Build failed or was cancelled"
            exit 1
          fi
          echo "All platform builds passed"
